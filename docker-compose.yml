services:
  app:
    build: .
    ports:
      # Host port 3001 (container still listens on 3000 internally) — 3000
      # is already taken by another app on this server. Bound to localhost
      # only; nginx is what should be reachable from the internet, proxying
      # to 127.0.0.1:3001. See DOCKER.md.
      - "127.0.0.1:3001:3000"
    volumes:
      # Persists data/devices.json across container restarts. See the "Data
      # persistence" section in DOCKER.md.
      - device-data:/app/data

volumes:
  device-data:
